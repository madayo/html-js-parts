<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>🕐️Stopwatch🕐️</title>
    <style>
      html,
      body {
        font-size: 22px;
      }

      @media screen and (max-width: 480px) {

        html,
        body {
          font-size: 0.9rem;
        }
      }

      @keyframes running-border {

        0%,
        100% {
          border-color: #22c55e;
        }

        50% {
          border-color: #e5e7eb;
        }
      }

      .running-border {
        animation: running-border .8s ease-in-out infinite;
      }
    </style>
  </head>

  <body class="bg-white text-center">
    <div id="app" class="mx-auto mt-4 max-w-full px-[10px]">
      <div class="my-2">
        <button type="button"
          class="inline-flex items-center rounded bg-red-600 px-3 py-1 text-sm font-medium text-white hover:bg-red-700"
          @click="allReset">
          {{ allResetCondition.label }}
        </button>
      </div>

      <div class="flex flex-wrap justify-center gap-1">
        <div v-for="(list, index) in lists" class="p-1">
          <div :class="[
            'flex flex-col gap-2 rounded-md border-[2.5px] p-2',
            'bg-white',
            list.status === 'running' ? 'running-border' : 'border-gray-200 transition-colors duration-200'
          ]" :style="list.status === 'running' ? { animationDelay: list.blinkDelay } : {}">
            <input type="text"
              class="block h-5 w-full rounded border border-gray-300 px-2 text-[0.55rem] focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
              v-model="list.name">

            <div class="flex flex-wrap items-center gap-2">
              <input type="text" readonly
                :class="[
                  'h-4 w-[75px] shrink-0 rounded border border-gray-300 text-center text-[0.55rem] outline-none',
                  list.accumulationMilliSeconds > 0 ? 'bg-blue-200' : 'bg-white'
                ]"
                :value="formatMs(list.accumulationMilliSeconds)">

              <div class="flex gap-2 items-center justify-start">
                <button @click="toggleTimer(index)" type="button"
                  :aria-label="list.status === 'running' ? 'Pause' : 'Start'"
                  :title="list.status === 'running' ? 'Pause' : 'Start'" :class="[
                    'flex h-4 w-8 items-center justify-center rounded text-white',
                    list.status === 'running' ? 'bg-gray-700 hover:bg-gray-800' : 'bg-sky-500 hover:bg-sky-600'
                  ]">
                  <svg v-if="list.status === 'running'" class="h-2 w-2" viewBox="0 0 24 24" fill="currentColor"
                    aria-hidden="true">
                    <rect x="6" y="5" width="4" height="14" rx="1" />
                    <rect x="14" y="5" width="4" height="14" rx="1" />
                  </svg>
                  <svg v-else class="h-2 w-2" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M8 5.14v13.72a1 1 0 0 0 1.51.86l10.29-6.86a1 1 0 0 0 0-1.72L9.51 4.28A1 1 0 0 0 8 5.14Z" />
                  </svg>
                </button>
                <button @click="resetTimer(index)" type="button"
                  :aria-label="list.resetConfirming ? 'Are you sure?' : 'Reset'"
                  :title="list.resetConfirming ? 'Are you sure?' : 'Reset'" :class="[
                    'flex h-4 w-4 items-center justify-center rounded text-white',
                    list.resetConfirming ? 'bg-orange-500 hover:bg-orange-600' : 'bg-red-600 hover:bg-red-700'
                  ]">
                  <svg class="h-2 w-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                    <path d="M3 3v5h5" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <script>
      const maxTimerCount = 20
      const runningBorderDurationMs = 2000

      const initTimer = id => {
        return {
          id: id,
          name: '',
          timer: null,
          status: 'stopped',
          runningAt: null,
          accumulationMilliSeconds: 0,
          blinkDelay: '0ms',
          resetConfirming: false,
          resetConfirmTimer: null,
        }
      }
      const createEmptyTimer = () => new Array(maxTimerCount).fill('').map((v, i) => { return initTimer(i) })

      const allResetDefault = {
        status: 'default',
        label: 'Reset all'
      }
      const allResetConfirm = {
        status: 'confirm',
        label: 'Are you sure?'
      }
      const saveTerm = 1000 * 10

      new Vue({
        el: '#app',
        data: {
          lastLocalStorageSavedAt: new Date().getTime(),
          allResetCondition: allResetDefault,
          lists: createEmptyTimer()
        },
        mounted() {
          const savedLists = localStorage.lists ? JSON.parse(localStorage.lists) : []
          this.lists = createEmptyTimer()

          if (Array.isArray(savedLists) && savedLists.length > 0) {
            this.lists = this.lists.map((list, index) => {
              const saved = savedLists[index] || {}
              return {
                ...list,
                ...saved,
                id: index,
                name: saved.name || '',
                status: 'stopped',
                runningAt: saved.runningAt || null,
                accumulationMilliSeconds: Number(saved.accumulationMilliSeconds || 0),
                resetConfirming: false,
                resetConfirmTimer: null,
              }
            })
          }
        },
        methods: {
          formatMs(_ms) {
            const hour = Math.floor(_ms / 3600000)
            const minute = Math.floor((_ms - 3600000 * hour) / 60000)
            const second = Math.floor((_ms - 3600000 * hour - 60000 * minute) / 1000)
            const hh = ('00' + hour).slice(-2)
            const mm = ('00' + minute).slice(-2)
            const ss = ('00' + second).slice(-2)
            return `${hh} : ${mm} : ${ss} `
          },
          toggleTimer(id) {
            if (this.lists[id].status === 'running') {
              this.stopTimer(id)
            } else {
              this.startTimer(id)
            }
          },
          startTimer(id) {
            if (this.lists[id].status === 'stopped') {
              this.lists[id].status = 'running'
              this.lists[id].runningAt = Date.now()
              this.lists[id].blinkDelay = `-${Date.now() % runningBorderDurationMs}ms`
              this.lists[id].timer = setInterval(() => {
                this.lists[id].accumulationMilliSeconds += (Date.now() - this.lists[id].runningAt)
                this.lists[id].runningAt = Date.now()
              }, 10)
            }
          },
          stopTimer(id) {
            if (this.lists[id].status === 'running') {
              clearInterval(this.lists[id].timer)
              this.lists[id].timer = null
              this.lists[id].status = 'stopped'
              this.lists[id].runningAt = null
            }
          },
          resetTimer(id) {
            if (!this.lists[id].resetConfirming) {
              this.lists[id].resetConfirming = true
              this.lists[id].resetConfirmTimer = setTimeout(() => {
                this.lists[id].resetConfirming = false
              }, 3000)
              return
            }

            clearTimeout(this.lists[id].resetConfirmTimer)
            this.lists[id].resetConfirmTimer = null
            this.lists[id].resetConfirming = false

            clearInterval(this.lists[id].timer)
            this.lists[id].timer = null
            this.lists[id].status = 'stopped'
            this.lists[id].runningAt = null
            this.lists[id].accumulationMilliSeconds = 0
            localStorage.lists = JSON.stringify(this.lists)
            this.lastLocalStorageSavedAt = new Date().getTime()
            this.allResetCondition = allResetDefault
          },
          allReset() {
            if (this.allResetCondition.status === allResetDefault.status) {
              this.allResetCondition = allResetConfirm
              setTimeout(() => {
                this.allResetCondition = allResetDefault
              }, 3000)
            } else {
              for (let i = 0; i < maxTimerCount; i++) {
                this.stopTimer(i)
              }
              this.lists = createEmptyTimer()
              localStorage.lists = JSON.stringify(this.lists)
              this.lastLocalStorageSavedAt = new Date().getTime()
              this.allResetCondition = allResetDefault
            }
          }
        },
        watch: {
          lists: {
            handler(newValue, oldValue) {
              const current = new Date().getTime()
              if (this.lastLocalStorageSavedAt + saveTerm < current) {
                localStorage.lists = JSON.stringify(this.lists)
                this.lastLocalStorageSavedAt = current
              }
            },
            deep: true
          }
        },
      })
    </script>
  </body>

</html>
